name: Keep Streamlit app awake

# Streamlit Community Cloud (free tier) puts apps to sleep after ~7 days of
# zero traffic. This workflow hits the app URL every 6 hours so traffic is
# never zero — the app stays warm and the owner never has to click
# "Wake up" on Monday morning.
#
# Setup (one-time):
#   1. Go to repo Settings → Secrets and variables → Actions → Variables
#   2. Add a Repository variable:  STREAMLIT_APP_URL = https://<your-app>.streamlit.app/
#   3. That's it — the schedule below fires automatically.
#
# Cost: zero. GitHub Actions allows 2000 free minutes/month on public repos
# and this job uses ~10s per run × 4 runs/day × 30 days ≈ 20 minutes/month.

on:
  schedule:
    # Every 6 hours, on the hour (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          URL="${{ vars.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::STREAMLIT_APP_URL repo variable is not set. See workflow file header for setup."
            exit 1
          fi
          echo "Pinging $URL"
          # -L follows redirects; -f fails on 4xx/5xx; --max-time caps it
          # at 60s in case the app is cold-starting.
          curl -fsSL --max-time 60 "$URL" > /dev/null
          echo "✓ App responded — keepalive ping successful"
